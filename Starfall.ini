; Starfall 0.1 | standalone test rules
[Starfall.PassiveTypes]
0=SF_KillHeal
1=SF_LifeSteal
2=SF_Counter
3=SF_Bounty
4=SF_ResearchRepair

; Grizzly: every third enemy kill restores 50 HP.
[MTNK]
Starfall.Passives=SF_KillHeal

[SF_KillHeal]
Trigger=OnKill
Filter.TargetHouse=Enemies,Neutral
Condition.Count=3
Action=Heal
Action.Target=Self
Action.Amount=50

[HTNK]
Starfall.Passives=SF_LifeSteal

[TTNK]
Starfall.Passives=SF_Counter

[SF_LifeSteal]
Trigger=OnDealDamage
Filter.TargetHouse=Enemies
Action=Heal
Action.Target=Self
Action.PercentOfDamage=20%

[SF_Counter]
Trigger=OnTakeDamage
Filter.TargetHouse=Enemies
Condition.MinDamage=1
Cooldown=90
Action=Damage
Action.Target=Attacker
Action.Amount=40

[SF_Bounty]
Trigger=OnKill
Filter.TargetHouse=Enemies
Filter.TargetKind=Building
Action=GiveCredits
Action.Amount=100

[SF_ResearchRepair]
Trigger=OnKill
Filter.TargetHouse=Enemies
Action=Heal
Action.Target=Self
Action.Amount=25

; Register options with distinct numeric keys. Each player gets up to three eligible options.
; Countries is optional: comma-separated country IDs (e.g. Americans,French), empty means all.
; Keep section IDs stable across saves. TargetTypes accepts a list or * for all.
; Prerequisites lists research section IDs. The purchasing player must own every listed ID.
; Detail placeholders: {amount}, {percent}, {count}, {chance}, {cooldown}.
[Starfall.Research]
Title=请选择升级

[Starfall.ResearchTypes]
0=SF_Repair
1=SF_Drain
2=SF_Riposte
3=SF_LasherDrain
4=SF_EmergencyFunds
5=SF_SovietTech
6=SF_TeslaTraining

[SF_Repair]
Name=战场维修
Summary=击杀时修复自身
Detail=击杀敌人时，额外恢复 {amount} 点生命
Icon=sfrheal.pcx
Countries=
TargetTypes=MTNK
Passive=SF_ResearchRepair

[SF_Drain]
Name=伤害吸血
Summary=造成伤害时吸取生命
Detail=按实际伤害的 {percent}% 恢复生命
Icon=sfrdrain.pcx
Countries=
TargetTypes=MTNK
Passive=SF_LifeSteal

[SF_Riposte]
Name=受击反击
Summary=受击时反击攻击者
Detail=对攻击者造成 {amount} 点基础伤害
Icon=sfrripst.pcx
Countries=
TargetTypes=MTNK
Passive=SF_Counter

[SF_LasherDrain]
Name=伤害吸血
Summary=造成伤害时吸取生命
Detail=按实际伤害的 {percent}% 恢复生命
Icon=sfrdrain.pcx
TargetTypes=LTNK
Passive=SF_LifeSteal
Prerequisites=SF_Drain
; Each operational civilian hospital generates 10 points per 150 game frames for its owner.
[CAHOSP]
Starfall.ResearchPoints=10
Starfall.ResearchInterval=150

[SF_EmergencyFunds]
Name=紧急拨款
Summary=立即增加本方资金
Effect=GiveCredits
Credits=2000
Icon=sfrheal.pcx

[SF_SovietTech]
Name=技术破译
Summary=解锁苏军渗透科技
Effect=UnlockTech
Technology=Soviet
Icon=sfrripst.pcx

[SF_TeslaTraining]
Name=电磁改编
Summary=将现有动员兵改编为磁暴步兵
Effect=ConvertInfantry
FromType=E2
ToType=SHK
Icon=sfrripst.pcx