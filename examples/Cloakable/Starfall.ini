; Merge registry entries into unused slots and append to existing unit bindings.
; This example uses the native MTNK type from Yuri's Revenge.
[Starfall.PassiveTypes]
0=SF_StationaryCloak

[MTNK]
Starfall.Passives=SF_StationaryCloak

[SF_StationaryCloak]
Trigger=WhileState
Condition.SelfMoving=no
Condition.StateDurationSeconds=2
Modifier.Cloakable=yes

; Native cloak delay, firing, detection, and CloakStop still apply.
; Moving withdraws this source; innate/crate cloaking is unaffected.
