; Starfall Lab / 流火实验室 - 海克斯乱斗示例
; 项目选自《红警2海克斯乱斗》表格；非叠加的生命提升以装甲倍率提供等效耐久。
; 使用本示例时，将同目录的 HexBrawlIcons 文件夹复制到游戏根目录。
; 本文件可作为独立 Starfall.ini 使用。与已有配置合并时：
; 1. 合并同名注册表，用未占用的数字键注册每一项；不要重复创建同名注册表段。
; 2. 合并项目、效果和被动段；本文件使用 SF_HX_ 前缀避免常见 ID 冲突。
; 3. 保留已有设置，例如 [Starfall.PassiveLimits] 与科研点来源。
; 科研点每项 100；开局发 100、每 6 游戏秒加 1，科技医院另可产点。
; 游戏须加载本 INI 后重新开始对局。
; 如使用其他 MOD，请根据其实际 rulesmd.ini 核对单位 ID 与原生单位行为。
; 国家限制按《远征》常规生产条件设置，不因临时占领其他阵营建筑而改变。

; builtin:* 使用内嵌音效，其他 WAV 路径相对游戏根目录；按钮留空使用原生点击音。
