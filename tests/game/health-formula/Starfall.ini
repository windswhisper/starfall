[Starfall.PassiveTypes]
0=Dynamic
1=Growth
2=Malformed
3=DamageFormula
4=InvalidDamageState
5=InvalidDamageKill
6=DistanceTest
7=DistanceState
8=TargetState
9=TargetEvent
10=TargetPending
11=ConditionalState
12=ConditionalEvent
13=ConditionalDistance
14=ConditionalSnapshot
15=RemovedShield

[RemovedShield]
Trigger=OnKill
Action=GrantShield
Action.ShieldType=OldShield

[Dynamic]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 100%))
Modifier.FirepowerMultiplier=$(1+((Self.MaxHealth-Self.Health)/Self.MaxHealth)*150%)
Modifier.SpeedMultiplier=$(max(1,Self.MaxHealth/Self.Health))
Modifier.ArmorMultiplier=$(1/(Self.Health-Self.Health))
Modifier.WeaponRangeMultiplier=$(1+(Self.MaxHealth-Self.Health)/Self.MaxHealth)
Modifier.FireRateMultiplier=$(clamp(Self.MaxHealth/Self.Health,1,1.25))

[Growth]
Trigger=OnKill
Actions=HealFirst,SkipDivision,TrainSpeed,TrainFirepower,TrainArmor,TrainWeaponRange,TrainFireRate

[HealFirst]
Action=Heal
Action.Amount=500

[SkipDivision]
Action=ChangeFirepower
Action.Percent=$(1/0)

[TrainSpeed]
Action=ChangeSpeed
Action.Target=Victim
Action.Percent=$(((Self.MaxHealth-Self.Health)/Self.MaxHealth)*1.5%)

[TrainFirepower]
Action=ChangeFirepower
Action.Target=Victim
Action.Percent=$(((Self.MaxHealth-Self.Health)/Self.MaxHealth)*1.5%)

[TrainArmor]
Action=ChangeArmor
Action.Target=Victim
Action.Percent=$(((Self.MaxHealth-Self.Health)/Self.MaxHealth)*1.5%)

[TrainWeaponRange]
Action=ChangeWeaponRange
Action.Target=Victim
Action.Percent=$(((Self.MaxHealth-Self.Health)/Self.MaxHealth)*1.5%)

[TrainFireRate]
Action=ChangeFireRate
Action.Target=Victim
Action.Percent=$(((Self.MaxHealth-Self.Health)/Self.MaxHealth)*1.5%)

[Malformed]
Trigger=OnKill
Action=ChangeFireRate
Action.Percent=$(Self.Missing)

[DamageFormula]
Trigger=OnDealDamage
Actions=FormulaHeal,FormulaResearch,FormulaStat,FormulaNegative

[FormulaHeal]
Action=Heal
Action.Amount=$(min(Event.Damage * 25%, 100))

[FormulaResearch]
Action=GiveResearchPoints
Action.Amount=$(Event.Damage * 50%)

[FormulaStat]
Action=ChangeFirepower
Action.Target=Victim
Action.Percent=$(Event.Damage * 0.1%)

[FormulaNegative]
Action=GiveResearchPoints
Action.Amount=$(0 - Event.Damage)

[InvalidDamageState]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.FirepowerMultiplier=$(1+Event.Damage)

[InvalidDamageKill]
Trigger=OnKill
Action=Heal
Action.Amount=$(Event.Damage)

[DistanceTest]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=$(Event.Distance * 100)

[DistanceState]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.ArmorMultiplier=$(1+Event.Distance * 1%)

[TargetState]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.ArmorMultiplier=$(1+(Target.MaxHealth-Target.Health)/Target.MaxHealth+Target.Cost/10000)

[TargetEvent]
Trigger=OnTakeDamage
Actions=TargetCredits,TargetHeal,TargetFirepower

[TargetCredits]
Action=GiveResearchPoints
Action.Amount=$(Target.MaxHealth-Target.Health)

[TargetHeal]
Action=Heal
Action.Amount=$(Target.Health/10)

[TargetFirepower]
Action=ChangeFirepower
Action.Percent=$(Target.Health/Target.MaxHealth*10%)

[TargetPending]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=$(Target.Health+(Target.Cost+Self.Cost)*10%)

[ConditionalState]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.FireRateMultiplier=$(if(Self.Health >= 0, 1.25+Self.Cost/10000, Target.Health / Event.Distance))

[ConditionalEvent]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=$(if(Self.Health > 0, Self.Cost, Target.Health / Event.Distance))

[ConditionalDistance]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.ArmorMultiplier=$(if(Event.Distance > 5, 1.30, 1))

[ConditionalSnapshot]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=$(if(Event.Distance > 5, 100, 10))
