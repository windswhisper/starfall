[Starfall.PassiveTypes]
0=RateGain
1=RateLowHealth
2=RateLoss

[Starfall.PassiveLimits]
FireRate=200%
FireRate.Min=50%

[RateGain]
Trigger=OnKill
Action=ChangeFireRate
Action.Percent=+50%

[RateLoss]
Trigger=OnDeploy
Action=ChangeFireRate
Action.Percent=-75%

[RateLowHealth]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 80%))
Modifier.FireRateMultiplier=1.50
