[Starfall.PassiveTypes]
0=CarrierLink
1=DroneReward
2=BadLink
3=DroneArmor

[CarrierLink]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 50%))
Modifier.SpawnPassives=DroneReward,DroneArmor

[DroneReward]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=7

[DroneArmor]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.ArmorMultiplier=1.25

[BadLink]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.SpawnPassives=Typo
