[Starfall.PassiveTypes]
0=Born
1=Chassis
2=Trainer
3=Talent
4=Band
5=ExpiredKey
6=BadRange
7=BadGrant
8=BadDuration
9=Pulse
10=DeathReward
11=KillBand
12=Boost
13=ShareDamage

[MTNK]
Starfall.Passives=Born,Band

[Born]
Trigger=OnPassiveGained
Action=ChangeMaxHealth
Action.Amount=10

[Chassis]
Trigger=OnPassiveGained
Action=ChangeMaxHealth
Action.Amount=50

[Band]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 50%) * (Self.Health <= Self.MaxHealth * 50%))
Modifier.FirepowerMultiplier=2.0

[Trainer]
Trigger=OnKill
Actions=GiveTalent,BoostVictim,GiveOwner,GiveVictim

[GiveTalent]
Action=GrantPassive
Action.Passive=Talent
Action.Target=Victim
Action.Duration=12

[BoostVictim]
Action=GrantPassive
Action.Passive=Boost
Action.Target=Victim
Action.Duration=12

[Boost]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Modifier.FirepowerMultiplier=1.25

[ShareDamage]
Trigger=OnDealDamage
Action=GiveResearchPoints
Action.Amount=0
Action.PercentOfDamage=25%

[GiveOwner]
Action=GiveResearchPoints
Action.Amount=5

[GiveVictim]
Action=GiveResearchPoints
Action.Target=Victim
Action.Amount=2

[Talent]
Trigger=OnPassiveGained
Action=GiveResearchPoints
Action.Amount=3

[Pulse]
Trigger=OnPassiveGained
Action=GiveResearchPoints
Action.Amount=11

[DeathReward]
Trigger=OnDeath
Action=GiveResearchPoints
Action.Amount=17

[KillBand]
Trigger=OnKill
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%) * (Self.Health >= Self.MaxHealth * 50%))
Action=GiveResearchPoints
Action.Amount=1

[ExpiredKey]
Trigger=OnKill
Condition.SelfHealthBelow=50%
Action=GiveResearchPoints
Action.Amount=1000

[BadRange]
Trigger=OnKill
Condition.SelfHealthAtLeast=60%
Condition.SelfHealthAtMost=50%
Action=GiveResearchPoints
Action.Amount=1000

[BadGrant]
Trigger=OnKill
Action=GrantPassive
Action.Passive=Missing

[BadDuration]
Trigger=OnKill
Action=GrantPassive
Action.Passive=Talent
Action.Duration=0

[Starfall.ResearchTypes]
0=BuyChassis

[BuyChassis]
Effect=GrantPassive
TargetTypes=MTNK
Passive=Chassis
