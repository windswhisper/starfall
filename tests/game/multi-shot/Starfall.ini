[Starfall.PassiveTypes]
0=SplitFire
1=CountShots
2=InvalidSplit
3=FixedShot
4=FormulaShot
5=BadCount
6=BadFormula

[SplitFire]
Trigger=WhileState
Condition.Formula=$(Self.Health >= Self.MaxHealth * 0.5)
Stack.Max=6
Modifier.MultiShot=yes

[CountShots]
Trigger=OnFire
MaxTriggers=1000
Action=GiveCredits
Action.Amount=1

[FixedShot]
Trigger=WhileState
Condition.Formula=$(1)
MultiShot=3

[FormulaShot]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.MultiShot=$(1 + This.Stack / 2)
Stack.Max=6

[BadCount]
Trigger=WhileState
Condition.Formula=$(1)
MultiShot=2.5

[BadFormula]
Trigger=WhileState
Condition.Formula=$(1)
MultiShot=$(Event.Damage)

[InvalidSplit]
Trigger=OnFire
Modifier.MultiShot=yes
Action=Heal
Action.Amount=5
