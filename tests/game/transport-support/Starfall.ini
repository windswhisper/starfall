[Starfall.PassiveTypes]
0=Support
1=Boost
2=KillReward
3=NonStackSupport
4=ArmorBoost
5=ConditionalSupport
6=SpeedBoost
7=GainReward
8=BadCycle
9=PersonalCombat

[PersonalCombat]
Trigger=WhileState
Condition.Formula=$(Self.Health <= Self.MaxHealth * 50%)
Modifier.FirepowerMultiplier=2
Modifier.WeaponRangeMultiplier=1.5
Modifier.FireRateMultiplier=$(Self.MaxHealth / Self.Health)
Modifier.ArmorMultiplier=1.75

[Support]
Trigger=WhileState
Modifier.TransportPassives=Boost,KillReward,GainReward
Modifier.TransportPassives.Stack=yes

[Boost]
Trigger=WhileState
Condition.Formula=$(1)
Stack.Max=2
Modifier.FirepowerMultiplier=$(1 + This.Stack * 0.3)

[KillReward]
Trigger=OnKill
Stack.Max=2
Action=GiveResearchPoints
Action.Amount=$(This.Stack * 10)

[GainReward]
Trigger=OnPassiveGained
Action=GiveResearchPoints
Action.Amount=7

[NonStackSupport]
Trigger=WhileState
Modifier.TransportPassives=ArmorBoost

[ArmorBoost]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.ArmorMultiplier=1.2

[ConditionalSupport]
Trigger=WhileState
Condition.Formula=$(Self.Health <= Self.MaxHealth * 50%)
Modifier.TransportPassives=SpeedBoost

[SpeedBoost]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.SpeedMultiplier=1.5

[BadCycle]
Trigger=WhileState
Modifier.TransportPassives=BadCycle
