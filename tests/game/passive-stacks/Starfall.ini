[Starfall.PassiveTypes]
0=StackBuff
1=StackGain
2=StackVictim
3=StackReduce
4=StackStrip
5=SelfGrowth
6=BadStackMax
7=BadStackTarget
8=BadStackAmount
9=DeathStack
10=MarkDeathStack
11=StealList
12=StripList
13=LootA
14=LootB
15=InvalidStealCount
16=InvalidStealList

[StealList]
Trigger=OnDealDamage
Filter.TargetHouse=Enemies
MaxTriggers=8
Action=StealPassive
Action.Passive=LootA,LootB,loota
Action.Amount=2

[StripList]
Trigger=OnTakeDamage
Action=RemovePassive
Action.Target=Target
Action.Passive=LootB,StackReduce,LootA,LootB

[LootA]
Trigger=OnPassiveGained
Stack.Max=4
Action=GiveCredits
Action.Amount=$(This.Stack)

[LootB]
Trigger=OnTakeDamage
Action=Heal
Action.Amount=1

[InvalidStealCount]
Trigger=OnFire
Action=StealPassive
Action.Passive=LootA
Action.Amount=0

[InvalidStealList]
Trigger=OnFire
Action=StealPassive
Action.Passive=LootA,BadStackTarget

[StackBuff]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Stack.Max=3
Modifier.FirepowerMultiplier=$(1 + This.Stack * 5%)

[StackGain]
Trigger=OnKill
Action=ChangePassiveStack
Action.Passive=StackBuff
Action.Amount=1

[StackVictim]
Trigger=OnKill
Action=ChangePassiveStack
Action.Target=Victim
Action.Passive=StackBuff
Action.Amount=1

[StackReduce]
Trigger=OnDeploy
Action=ChangePassiveStack
Action.Passive=StackBuff
Action.Amount=-2

[StackStrip]
Trigger=OnPromote
Action=RemovePassive
Action.Passive=StackBuff

[SelfGrowth]
Trigger=OnFire
Actions=SelfGrowth_Add,SelfGrowth_Points,SelfGrowth_Armor

[SelfGrowth_Add]
Action=ChangePassiveStack
Action.Passive=SelfGrowth
Action.Amount=1

[SelfGrowth_Points]
Action=GiveResearchPoints
Action.Amount=$(This.Stack * 10)

[SelfGrowth_Armor]
Action=ChangeArmor
Action.Percent=$(This.Stack * 1%)

[BadStackMax]
Trigger=WhileState
Condition.Formula=$((Self.Health >= Self.MaxHealth * 0%))
Stack.Max=0
Modifier.FirepowerMultiplier=1.1

[BadStackTarget]
Trigger=OnKill
Action=ChangePassiveStack
Action.Passive=MissingPassive
Action.Amount=1

[BadStackAmount]
Trigger=OnKill
Action=ChangePassiveStack
Action.Passive=StackBuff
Action.Amount=0

[DeathStack]
Trigger=OnDeath
Action=GiveResearchPoints
Action.Amount=$(This.Stack * 10)

[MarkDeathStack]
Trigger=OnFire
Action=ChangePassiveStack
Action.Passive=DeathStack
Action.Amount=1

[Starfall.ResearchTypes]
0=StackResearch

[StackResearch]
Effect=GrantPassive
TargetTypes=MTNK
Passive=StackBuff
