[Starfall.PassiveTypes]
0=PWGuard
1=PWAbsorb

[HTNK]
Starfall.Passives=PWGuard,PWAbsorb

[PWGuard]
Condition.Formula=$(Self.Health > 400)
Trigger=WhileState
Modifier.ProjectileShield.Radius=1.5
Modifier.ProjectileShield.DamageMultiplier=0.3

[PWAbsorb]
Trigger=WhileState
Condition.Formula=$(Self.Health <= 400)
Modifier.ProjectileShield.Radius=1.5
Modifier.ProjectileShield.DamageMultiplier=0