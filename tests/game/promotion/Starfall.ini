[Starfall.PassiveTypes]
0=AnyPromotion
1=VeteranPromotion
2=ElitePromotion
3=KillTraining
4=TrainingFormula
5=NoTraining

[KillTraining]
Trigger=WhileState
Modifier.ExperienceMultiplier=1.5

[TrainingFormula]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.ExperienceMultiplier=$(if(Self.Rank == 0, 2, 1))

[NoTraining]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.ExperienceMultiplier=0

[AnyPromotion]
Trigger=OnPromote
Action=GiveResearchPoints
Action.Amount=1

[VeteranPromotion]
Trigger=OnPromoteVeteran
Action=GiveResearchPoints
Action.Amount=10

[ElitePromotion]
Trigger=OnPromoteElite
Action=GiveResearchPoints
Action.Amount=100
