[Starfall.PassiveTypes]
0=RangeGrowth
1=RangeState
2=RangeLoss

[Starfall.PassiveLimits]
WeaponRange=200%
WeaponRange.Min=50%

[RangeGrowth]
Trigger=OnKill
Action=ChangeWeaponRange
Action.Percent=+100%

[RangeLoss]
Trigger=OnPromote
Action=ChangeWeaponRange
Action.Percent=-75%

[RangeState]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 80%))
Modifier.WeaponRangeMultiplier=1.50
