[Starfall.PassiveTypes]
0=LowHealthImmune
1=StationaryImmune
2=IronTarget
3=InvalidIronDuration
4=IronMissingDuration
5=TestEMP
6=TestEMP2

[LowHealthImmune]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 80%))
Condition.StateDurationSeconds=1
Modifier.Immune=yes
Modifier.ImmuneToMindControl=yes

[StationaryImmune]
Trigger=WhileState
Condition.SelfMoving=no
Condition.StateDurationSeconds=1
Modifier.Immune=yes
Modifier.ImmuneToMindControl=yes

[IronTarget]
Trigger=OnFire
Action=ApplyIronCurtain
Action.Target=Target
Action.Duration=30
MaxTriggers=1

[InvalidIronDuration]
Trigger=OnKill
Action=ApplyIronCurtain
Action.Duration=-1

[IronMissingDuration]
Trigger=OnKill
Action=ApplyIronCurtain

[TestEMP]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.EMP=yes

[TestEMP2]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.EMP=yes
