Condition.Nearby.Range=3
Condition.Nearby.Houses=Enemies
Condition.Nearby.Kinds=Infantry
Condition.Nearby.CountAtLeast=1
Condition.Nearby.ScanInterval=10
Modifier.PrimaryWeapon=M1Carbine

[SF_KillGrowth]
Trigger=OnKill
Filter.TargetHouse=Enemies
Action=ChangeScale
Action.Target=Self
Action.Percent=+10%
