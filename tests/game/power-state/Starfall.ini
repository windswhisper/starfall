[Starfall.PassiveTypes]
0=PlantBoost
1=PlantDouble
2=Efficiency
3=NoDrain
4=InvalidOutput
5=InvalidDrain

[PlantBoost]
Trigger=WhileState
Condition.Formula=$(This.Stack > 0)
Modifier.PowerMultiplier=1.5

[PlantDouble]
Trigger=WhileState
Condition.Formula=$(Self.Health > 0)
Modifier.PowerMultiplier=2

[Efficiency]
Trigger=WhileState
Condition.Formula=$(Self.Health > 0)
Modifier.PowerMultiplier=$(if(This.Stack > 0, 0.5, 1))

[NoDrain]
Trigger=WhileState
Condition.Formula=$(This.Stack > 0)
Modifier.PowerMultiplier=0

[InvalidOutput]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.PowerMultiplier=101

[InvalidDrain]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.PowerMultiplier=-1
