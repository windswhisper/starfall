[Starfall.PassiveTypes]
0=BlockOnce
1=HalfDamage
2=DamageChain
3=CountedBlock
4=DamageNotice
5=InvalidBlock
6=InvalidFormula
7=AttackerFormula
8=StackDamage
9=CooldownBlock
10=Finisher
11=InvalidOutgoingTarget

[Finisher]
Trigger=OnBeforeDealDamage
Filter.TargetHouse=Enemies
Condition.Formula=$(Target.Health < Target.MaxHealth * 50%)
Action=SetDamage
Action.Amount=$(Event.Damage * 150%)

[InvalidOutgoingTarget]
Trigger=OnBeforeDealDamage
Action=BlockDamage
Action.Target=Self

[BlockOnce]
Trigger=OnBeforeTakeDamage
MaxTriggers=1
Action=BlockDamage

[HalfDamage]
Trigger=OnBeforeTakeDamage
Action=SetDamage
Action.Amount=$(Event.Damage * 50%)

[DamageChain]
Trigger=OnBeforeTakeDamage
Actions=ChainHalf,ChainPlus

[ChainHalf]
Action=SetDamage
Action.Amount=$(Event.Damage * 50%)

[ChainPlus]
Action=SetDamage
Action.Amount=$(Event.Damage + 7)

[CountedBlock]
Trigger=OnBeforeTakeDamage
Filter.TargetHouse=Enemies
Condition.Count=2
Action=BlockDamage

[DamageNotice]
Trigger=OnTakeDamage
Action=GiveResearchPoints
Action.Amount=1

[InvalidBlock]
Trigger=OnKill
Action=BlockDamage

[InvalidFormula]
Trigger=OnBeforeTakeDamage
Action=SetDamage
Action.Amount=$(Event.Damage / 0)

[AttackerFormula]
Trigger=OnBeforeTakeDamage
Action=SetDamage
Action.Amount=$(if(Target.Health > 0, 1, 0))

[StackDamage]
Trigger=OnBeforeTakeDamage
Stack.Max=5
Action=SetDamage
Action.Amount=$(Event.Damage / (This.Stack + 1))

[CooldownBlock]
Trigger=OnBeforeTakeDamage
Cooldown=90
Action=BlockDamage
