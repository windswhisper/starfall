[Starfall.PassiveTypes]
0=PartialShield
1=FullDamageShield
2=ZeroShield
3=InvalidShield

[HTNK]
Starfall.Passives=PartialShield,FullDamageShield,ZeroShield

[PartialShield]
Trigger=WhileState
Condition.Formula=$(Self.Health > 700)

[FullDamageShield]
Trigger=WhileState
Condition.Formula=$((Self.Health <= 700) * (Self.Health > 400))
Modifier.ProjectileShield.Radius=2

[ZeroShield]
Trigger=WhileState
Condition.Formula=$(Self.Health <= 400)
Modifier.ProjectileShield.Radius=2
Modifier.ProjectileShield.BlockInviso=yes
Modifier.ProjectileShield.DamageMultiplier=0

[InvalidShield]
Trigger=WhileState
Modifier.ProjectileShield.Radius=2
Modifier.ProjectileShield.DamageMultiplier=-1
