[Starfall.PassiveTypes]
0=Stacked
1=Single
2=Double
3=FullProbe
4=ShellBuff
5=NativeBuff
6=TestAura
7=AuraBuff
8=WrongAction
9=BadSwitch
10=DefaultGrant

[Stacked]
Trigger=OnPassiveGained
Stack.Max=2
MaxTriggers=10
Action=GiveCredits
Action.Amount=1

[Single]
Trigger=OnDeploy
Action=GrantPassive
Action.Passive=Stacked
Action.Duration=10
Action.StackOnReapply=yes

[Double]
Trigger=OnPromote
Actions=Step,Step

[Step]
Action=GrantPassive
Action.Passive=Stacked
Action.Duration=10
Action.StackOnReapply=yes

[DefaultGrant]
Trigger=OnKill
Action=GrantPassive
Action.Passive=Stacked
Action.Duration=10

[FullProbe]
Trigger=OnFire
Cooldown=30
Action=GrantPassive
Action.Passive=Stacked
Action.Duration=10
Action.StackOnReapply=yes

[ShellBuff]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.ArmorMultiplier=1

[MTNK]
Starfall.Passives=NativeBuff

[NativeBuff]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.SpeedMultiplier=1

[TestAura]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=-1
Modifier.Aura.TargetTypes=MTNK
Modifier.Aura.Passives=AuraBuff

[AuraBuff]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.SpeedMultiplier=1

[AP]
Starfall.GrantPassives=ShellBuff,NativeBuff,AuraBuff
Starfall.GrantPassives.Duration=7
Starfall.GrantPassives.StackOnReapply=yes
Starfall.GrantPassives.Houses=Enemies

[WrongAction]
Trigger=OnKill
Action=Heal
Action.Amount=1
Action.StackOnReapply=yes

[BadSwitch]
Trigger=OnKill
Action=GrantPassive
Action.Passive=Stacked
Action.StackOnReapply=maybe

[HE]
Starfall.GrantPassives=Stacked
Starfall.GrantPassives.StackOnReapply=maybe
