[Starfall.ResearchTypes]
0=AntiArmor
1=CreditPreview
2=InvalidPreview
3=Campaign
4=StageFollowup
5=CampaignUpgrade
6=BondA
7=BondB
8=BondC
9=BondA2
10=ExitB
11=BondD
12=FieldLogistics

[Starfall.ResearchBondTypes]
0=ArmorHunter
1=Supply
2=InvalidBond

[ArmorHunter]
Members=BondA,BondB,BondC,BondA2,BondD,BondA
Stages=Hunter3

[Hunter3]
RequiredCount=3
Effects=BondLicense,BondFire,BondCash

[Supply]
Members=BondA,BondB,BondD
Stages=Supply2

[Supply2]
RequiredCount=2
Effect=GiveCredits
Credits=30

[InvalidBond]
Members=BondA,NoSuch
Stages=Hunter3

[BondLicense]
Effect=UnlockTech
Technology=CLEG

[BondFire]
Effect=GrantPassive
Passive=BondMarker
TargetTypes=MTNK

[BondMarker]
Trigger=WhileState
Modifier.WeaponRangeMultiplier=1.10

[BondCash]
Effect=GiveCredits
Credits=200

[BondA]
GrantOnly=yes
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[BondB]
GrantOnly=yes
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[BondC]
GrantOnly=yes
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[BondA2]
GrantOnly=yes
Replaces=BondA
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[ExitB]
Repeatable=no
GrantOnly=yes
Replaces=BondB
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[BondD]
GrantOnly=yes
Effect=GiveCredits
Credits=1
Detail=Hunter $(Bond.ArmorHunter.Count)

[Campaign]
GrantOnly=yes
Stages=Arrival,BadStage,Bounty,Arsenal,Logistics,FreeChoice

[Arrival]
Condition.Formula=$(1)
Effect=GiveCredits
Credits=9

[BadStage]
Condition.Formula=$(Research.AntiArmor.Typo > 5)
Effect=GiveCredits
Credits=777

[Bounty]
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 50)
Effect=GiveCredits
Credits=50

[Arsenal]
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 75)
Effects=Permit,Training,Discount,StageRandom

[Permit]
Effect=UnlockTech
Technology=SNIPE

[Training]
Effect=GrantPassive
Passive=StageArmor
TargetTypes=MTNK

[Discount]
Effect=ModifyTypeCost
TargetTypes=MTNK
CostModifier=-25

[StageRandom]
Effect=GrantRandomResearch
Reward.Rarity=Insane

[StageFollowup]
Rarity=Insane
UnlockWithTech=SNIPE
Stages=FollowupCash

[FollowupCash]
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 75)
Effect=GiveCredits
Credits=11

[Logistics]
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 80)
Effects=EvolveTruck,EvolveInfantry,ReplaceIFV,CheapInfantry

[EvolveTruck]
Effect=ConvertVehicle
FromType=TRUCKA
ToType=TRUCKB

[EvolveInfantry]
Effect=ConvertInfantry
FromType=E1
ToType=E2

[ReplaceIFV]
Effect=ReplaceProduction
FromType=FV
ToType=TNKD

[CheapInfantry]
Effect=ModifyCategoryCost
Category=Infantry
CostModifier=-50%

[FreeChoice]
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 100)
Effect=GrantFreeResearch
Reward.ResearchOptions=CreditPreview

[CampaignUpgrade]
GrantOnly=yes
Replaces=Campaign
Effect=GiveCredits
Credits=1

[StageArmor]
Trigger=WhileState
Modifier.ArmorMultiplier=1.5

[CreditPreview]
Effect=GiveCredits
Credits=25
Detail=Credits {credits}, ratio $(Research.AntiArmor.Vehicle_Kills / 3)
Detail.Decimals=2

[InvalidPreview]
Effect=GiveCredits
Credits=10
Detail=Missing $(Research.AntiArmor.NoSuch), unit $(Self.Health), zero $(1/0), valid $(2+3), open $(1

[AntiArmor]
Detail=战绩 $(Research.AntiArmor.Vehicle_Kills)/100, reserve $(Research.AntiArmor.Reserve), left $(max(0,100 - Research.AntiArmor.Vehicle_Kills))
Counters=Vehicle_Kills,Reserve
Effects=TrainObservers,TrainGrizzlies

[TrainObservers]
Effect=GrantPassive
Passive=TrackKills
TargetTypes=*

[TrainGrizzlies]
Effect=GrantPassive
Passive=VeteranFire
TargetTypes=MTNK

[Starfall.PassiveTypes]
0=TrackKills
1=VeteranFire
2=SpendCounter
3=UnknownCounter
4=UnknownFormula
5=StageArmor
6=BondMarker
7=FieldLogisticsBonus

[FieldLogistics]
Repeatable=yes
GrantOnly=yes
Effects=LogisticsPayment,LogisticsPrice,LogisticsPassive

[LogisticsPayment]
Effect=GiveCredits
Credits=60

[LogisticsPrice]
Effect=ModifyTypeCost
TargetTypes=HTNK
CostModifier=-10%

[LogisticsPassive]
Effect=GrantPassive
Passive=FieldLogisticsBonus
TargetTypes=MTNK

[FieldLogisticsBonus]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.SpeedMultiplier=$(1+This.Stack*10%)

[TrackKills]
Trigger=OnKill
Filter.TargetHouse=Enemies
Filter.TargetKind=Vehicle
Action=ChangeResearchCounter
Action.Counter=AntiArmor.Vehicle_Kills
Action.Amount=1

[VeteranFire]
Trigger=WhileState
Condition.Formula=$(Research.AntiArmor.Vehicle_Kills >= 100)
Modifier.FirepowerMultiplier=1.25

[SpendCounter]
Trigger=OnDeploy
Action=ChangeResearchCounter
Action.Counter=AntiArmor.Vehicle_Kills
Action.Amount=$(99 - Research.AntiArmor.Vehicle_Kills)

[UnknownCounter]
Trigger=OnKill
Action=ChangeResearchCounter
Action.Counter=AntiArmor.Typo
Action.Amount=1

[UnknownFormula]
Trigger=WhileState
Condition.Formula=$(Research.AntiArmor.Typo > 0)
Modifier.FirepowerMultiplier=1.5
