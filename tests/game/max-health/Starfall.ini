[Starfall.PassiveTypes]
0=Grow
1=Shrink
2=Recover
3=Track
4=InvalidAmount
5=Observe
6=Engine

[Grow]
Trigger=OnKill
Action=ChangeMaxHealth
Action.Amount=+100

[Shrink]
Trigger=OnDeploy
Action=ChangeMaxHealth
Action.Amount=-100

[Recover]
Trigger=OnFire
Action=Heal
Action.Amount=17

[Track]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 100%))
Modifier.FirepowerMultiplier=$(1+(Self.MaxHealth-Self.Health)/Self.MaxHealth)

[Observe]
Trigger=OnTakeDamage
Action=GiveCredits
Action.Amount=1

[InvalidAmount]
Trigger=OnKill
Action=ChangeMaxHealth
Action.Amount=+-5

[Engine]
Trigger=OnKill
MaxTriggers=20
Actions=EngineHealth,EngineScale,EngineProjectile

[EngineHealth]
Action=ChangeMaxHealth
Action.MaxHealthPercent=10%

[EngineScale]
Action=ChangeScale
Action.Percent=5%

[EngineProjectile]
Action=ChangeProjectileScale
Action.Percent=5%
