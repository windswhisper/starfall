[Starfall.PassiveTypes]
0=FixedWarp
1=ScriptWarp
2=BadCoordinates
3=BadRadius
4=WarpToUnit
5=JumpToUnit
6=EjectToUnit
7=PassengersToUnit

[WarpToUnit]
Trigger=OnTakeDamage
Action=ChronoTeleport
Action.Target=Self
Action.Destination=Target
Action.Instant=yes

[JumpToUnit]
Trigger=OnFire
Action=JumpTo
Action.Target=Self
Action.Destination=Target
Action.Jump.Range=12

[EjectToUnit]
Trigger=OnFire
Action=EjectUnit
Action.Target=Self
Action.Destination=Target
Action.Eject.Range=12

[PassengersToUnit]
Trigger=OnFire
Action=EjectPassengers
Action.Target=Self
Action.Destination=Target
Action.Eject.Range=12

[FixedWarp]
Trigger=OnDeploy
Action=ChronoTeleport
Action.Destination=50,70

[ScriptWarp]
Trigger=OnFire
Action=RunScript
Action.Script=Teleport.lua
Action.Function=cast

[WarpResult]
Action=ChronoTeleport
Action.SearchRadius=3

[BadCoordinates]
Trigger=OnKill
Action=ChronoTeleport
Action.Destination=48,1,2

[BadRadius]
Trigger=OnKill
Action=ChronoTeleport
Action.Destination=48,70
Action.SearchRadius=-1
