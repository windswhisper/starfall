[Starfall.PassiveTypes]
0=Send
1=Receive
2=LoopStart
3=LoopReceive

[Send]
Trigger=OnDealDamage
Action=SendSignal
Action.Signal=Focus
Action.Signal.Target=Target
Action.Signal.Range=-1
Action.Signal.Houses=Self
Action.Signal.Value=$(Event.Damage * 20%)

[Receive]
Trigger=OnSignal
Signal=Focus
Filter.TargetHouse=Enemies
Filter.TargetKind=Vehicle
Filter.SenderHouse=Self
Filter.SenderKind=Vehicle
Condition.Formula=$((Target.Health > 0) * (Sender.Health > 0))
Action=GiveResearchPoints
Action.Amount=$(Target.Cost + Sender.Cost + Event.SignalValue)

[LoopStart]
Trigger=OnKill
Action=SendSignal
Action.Signal=Loop
Action.Signal.Target=Target
Action.Signal.Range=-1
Action.Signal.Houses=Self

[LoopReceive]
Trigger=OnSignal
Signal=Loop
Action=SendSignal
Action.Signal=Loop
Action.Signal.Target=Target
Action.Signal.Range=0
Action.Target=Self
Action.Signal.Houses=Self
