[Starfall.PassiveTypes]
0=ScriptPush
1=Pull
2=BadOffset
3=SlowStart
4=SlowEnds
5=BadEase
6=WeightLift
7=BadWeight
8=BadIron

[ScriptPush]
Trigger=OnFire
Action=RunScript
Action.Script=Motion.lua
Action.Function=cast

[Pull]
Trigger=OnDealDamage
Action=ForceMove
Action.Target=Target
Action.ForceMove.Mode=Pull
Action.ForceMove.IgnoreCollision=no
Action.ForceMove.Distance=4
Action.ForceMove.Center=Self
Action.ForceMove.Duration=10

[BadOffset]
Trigger=OnKill
Action=ForceMove
Action.ForceMove.Mode=Push
Action.ForceMove.Offset=1,0
Action.ForceMove.Duration=10

[SlowStart]
Trigger=OnFire
Action=ForceMove
Action.ForceMove.Offset=0,1
Action.ForceMove.Duration=12
Action.ForceMove.Tilt=no
Action.ForceMove.Easing=EaseIn

[SlowEnds]
Trigger=OnFire
Action=ForceMove
Action.ForceMove.Offset=0,1
Action.ForceMove.Duration=12
Action.ForceMove.Easing=EaseInOut

[BadEase]
Trigger=OnFire
Action=ForceMove
Action.ForceMove.Offset=0,1
Action.ForceMove.Duration=12
Action.ForceMove.Easing=unknown

[WeightLift]
Trigger=OnFire
Action=ForceMove
Action.Target=Target
Action.ForceMove.Mode=Launch
Action.ForceMove.Duration=6
Action.ForceMove.BlowWeight=4.5
Action.ForceMove.AffectsIronCurtain=yes

[BadWeight]
Trigger=OnFire
Action=ForceMove
Action.ForceMove.Mode=Launch
Action.ForceMove.Duration=6
Action.ForceMove.BlowWeight=nan

[BadIron]
Trigger=OnFire
Action=ForceMove
Action.ForceMove.Mode=Launch
Action.ForceMove.Duration=6
Action.ForceMove.AffectsIronCurtain=maybe
