[Starfall.PassiveTypes]
0=Beacon
1=ArmorGift
2=Welcome
3=EnemyBeacon
4=EnemyMark
5=SelfBeacon
6=FireGift
7=InvalidNested
8=InvalidRange
9=UnknownGift
10=InvalidKind
11=InvalidHouse
12=WrongTrigger

[Beacon]
Trigger=WhileState
Condition.Formula=$(This.Stack > 0)
Modifier.Aura.Range=3
Modifier.Aura.TargetTypes=@Vehicle,E1
Modifier.Aura.Passives=ArmorGift,Welcome

[ArmorGift]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.ArmorMultiplier=1.20

[Welcome]
Trigger=OnPassiveGained
MaxTriggers=10
Action=GiveResearchPoints
Action.Amount=1

[EnemyBeacon]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=-1
Modifier.Aura.Houses=Enemies
Modifier.Aura.TargetTypes=MTNK
Modifier.Aura.Passives=EnemyMark

[EnemyMark]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=1

[SelfBeacon]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=-1
Modifier.Aura.IncludeSelf=yes
Modifier.Aura.Passives=FireGift

[FireGift]
Trigger=OnFire
Action=GiveResearchPoints
Action.Amount=1

[InvalidNested]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=3
Modifier.Aura.Passives=Beacon

[InvalidRange]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=-2
Modifier.Aura.Passives=FireGift

[UnknownGift]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=3
Modifier.Aura.Passives=NoSuchPassive

[InvalidKind]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=3
Modifier.Aura.TargetTypes=@Foot
Modifier.Aura.Passives=FireGift

[InvalidHouse]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Aura.Range=-1
Modifier.Aura.Houses=Enemy
Modifier.Aura.Passives=FireGift

[WrongTrigger]
Trigger=OnKill
Modifier.Aura.Range=-1
Modifier.Aura.Passives=FireGift
