[Starfall.PassiveTypes]
0=StackGate
1=ValuesGate
2=SnapshotGate
3=BadSyntax
4=OldHealth
5=BadDamageState
6=TargetGate
7=EventDamageGate
8=ResetClock
9=ResetOnKill

[StackGate]
Trigger=WhileState
Stack.Max=5
Condition.Formula=$(This.Stack >= 5)
Modifier.FirepowerMultiplier=2.0

[ValuesGate]
Trigger=WhileState
Condition.Formula=$((Self.Ammo >= 2) * (Self.Passengers >= 1) * (Self.Health <= Self.MaxHealth * 50%))
Modifier.ArmorMultiplier=2.0

[SnapshotGate]
Trigger=OnKill
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%) * (Self.Ammo >= 2) * (Self.Passengers >= 1))
Action=GiveResearchPoints
Action.Amount=3

[BadSyntax]
Trigger=WhileState
Condition.Formula=$(This.Stack >= )
Modifier.FirepowerMultiplier=2

[OldHealth]
Trigger=WhileState
Condition.SelfHealthAtMost=50%
Modifier.FirepowerMultiplier=3

[BadDamageState]
Trigger=WhileState
Condition.Formula=$(Event.Damage > 0)
Modifier.FirepowerMultiplier=3

[TargetGate]
Trigger=WhileState
Condition.Formula=$(Target.Health > 0)
Modifier.SpeedMultiplier=1.5

[EventDamageGate]
Trigger=OnTakeDamage
Condition.Formula=$(Event.Damage >= 10)
Action=GiveResearchPoints
Action.Amount=$(Self.Ammo + Self.Passengers)


[ResetClock]
Trigger=WhileState
Condition.Formula=$(Self.Health >= 0)
Condition.StateDurationSeconds=1
Modifier.FirepowerMultiplier=1.1

[ResetOnKill]
Trigger=OnKill
Action=ResetStateTimer
Action.Target=Self
Action.Passive=ResetClock
