[Starfall.PassiveTypes]
0=DelayedCloak
1=AlwaysCloak
2=CloakOff
3=InvalidCloakValue
4=InvalidCloakEvent
5=InvalidCloakCondition

[DelayedCloak]
Trigger=WhileState
Condition.Formula=$(Self.Health <= Self.MaxHealth * 50%)
Condition.StateDurationSeconds=1
Modifier.Cloakable=yes

[AlwaysCloak]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=yes

[CloakOff]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=no
Modifier.FirepowerMultiplier=1.1

[InvalidCloakValue]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=true

[InvalidCloakEvent]
Trigger=OnKill
Modifier.Cloakable=yes
Action=Heal
Action.Amount=1

[InvalidCloakCondition]
Trigger=WhileState
Modifier.Cloakable=yes
