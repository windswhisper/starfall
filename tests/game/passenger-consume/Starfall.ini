[Starfall.PassiveTypes]
0=Feed
1=WhenFed
2=OriginalTarget
3=InvalidAmount
4=ConsumedDeath
5=FeedOther
6=CargoPower
7=NestedOnly
8=DigestA
9=DigestB
10=CargoSupport

[CargoSupport]
Trigger=WhileState
Modifier.TransportPassives=CargoPower
Modifier.TransportPassives.Stack=yes

[Feed]
Trigger=OnKill
Actions=TakeFood,StealTwo,FoodReward,TryRemovedPassenger

[StealTwo]
Action=StealPassive
Action.Passive=CargoPower,NestedOnly
Action.Amount=2

[CargoPower]
Trigger=OnDeploy
Action=Heal
Action.Amount=1

[NestedOnly]
Trigger=OnDeploy
Action=Heal
Action.Amount=1

[DigestA]
Trigger=OnPassengerConsumed
Actions=StealTwo,StealZero

[StealZero]
Action=StealPassive
Action.Passive=ConsumedDeath,NestedOnly

[DigestB]
Trigger=OnPassengerConsumed
Actions=StealTwo,StealZero

[TakeFood]
Action=ConsumePassenger

[FoodReward]
Action=GiveResearchPoints
Action.Amount=$(Target.Cost)

[TryRemovedPassenger]
Action=Damage
Action.Target=Target
Action.Amount=50

[WhenFed]
Trigger=OnPassengerConsumed
Filter.TargetKind=Infantry,Vehicle
Filter.TargetHouse=Self
Condition.Formula=$(Self.Passengers == 1)
Action=GiveResearchPoints
Action.Amount=$(Target.Health + Target.Cost)

[OriginalTarget]
Trigger=OnKill
Action=GiveResearchPoints
Action.Amount=$(Target.Cost)

[InvalidAmount]
Trigger=OnKill
Action=ConsumePassenger
Action.Amount=2

[ConsumedDeath]
Trigger=OnDeath
Action=GiveResearchPoints
Action.Amount=999

[FeedOther]
Trigger=OnKill
Actions=TakeOther,OtherReward

[TakeOther]
Action=ConsumePassenger
Action.Target=Target

[OtherReward]
Action=GiveResearchPoints
Action.Amount=$(Target.Health)
