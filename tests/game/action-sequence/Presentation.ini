[Starfall.PassiveTypes]
SFP=PresentationProbe
BadSFP=InvalidPresentation

[PresentationProbe]
Trigger=OnFire
Actions=UnitFlash,PointSmoke,LocationSound,GlobalShake,LuaFeedback

[UnitFlash]
Action=PlayAnim
Action.Anim=EXPLOSML

[PointSmoke]
Action=SpawnParticleSystem
Action.Target=VictimLocation
Action.ParticleSystem=SmallGreySSys

[LocationSound]
Action=PlaySound
Action.Target=VictimLocation
Action.Sound=GrizzlyTankAttack

[GlobalShake]
Action=ShakeScreen
Action.ShakeY=7
Action.ShakeX=5
Action.ShakeLocal=no

[LuaFeedback]
Action=RunScript
Action.Script=Presentation.lua
Action.Function=show

[InvalidPresentation]
Trigger=OnFire
Action=PlayAnim
Action.Anim=SF_MISSING_ANIM
