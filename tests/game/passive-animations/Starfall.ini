[Starfall.PassiveTypes]
0=AnimConditional
1=AnimAlways
2=AnimEvent
3=AnimOnly
4=AnimInvalid
5=TintOnly
6=BadTint
7=WoundedTint

[AnimConditional]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%))
Condition.StateDurationSeconds=1
Modifier.VisualScale=2.0
Anim=PIFF

[AnimAlways]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%))
Anim=PIFF
Anim.Always=yes

[AnimEvent]
Trigger=OnFire
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%))
Action=GiveCredits
Action.Amount=1
Anim=PIFF

[AnimOnly]
Anim=PIFF
Anim.Always=yes

[AnimInvalid]
Trigger=OnFire
Action=GiveCredits
Action.Amount=1
Anim.Always=yes

[TintOnly]
Tint.Color=0,0,200

[WoundedTint]
Trigger=WhileState
Condition.Formula=$((Self.Health <= Self.MaxHealth * 50%))
Condition.StateDurationSeconds=1
Tint.Color=255,0,0

[BadTint]
Tint.Color=32,256,32
